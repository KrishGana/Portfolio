<section class="experience">
    <div class="exp-inner">
        <div class="section-header">
            <div class="section-tag mono">// 05 &nbsp; Experience</div>
            <h2 class="section-heading">Career <span class="accent">Timeline.</span></h2>
        </div>

        <div class="timeline">
            <div class="timeline-line"></div>
            <div class="timeline-item" *ngFor="let job of jobs; let i = index" [class.left]="i % 2 === 0"
                [class.right]="i % 2 !== 0">
                <div class="timeline-dot"></div>
                <div class="timeline-card">
                    <div class="job-meta">
                        <span class="job-period mono">{{job.period}}</span>
                        <span class="job-badge" [style.background]="job.color">{{job.type}}</span>
                    </div>
                    <div class="job-company">{{job.company}}</div>
                    <div class="job-role">{{job.role}}</div>
                    <ul class="job-highlights">
                        <li *ngFor="let h of job.highlights">{{h}}</li>
                    </ul>
                    <div class="job-stack">
                        <span *ngFor="let t of job.tech">{{t}}</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- <div class="edu-section">

                    <div class="edu-note">{{e.note}}</div>
                </div>
            </div>
        </div> -->
    </div>
</section>
